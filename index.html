
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;

            color: #222;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #6c5ce7;
        }

        .vanban {

            background: #eeeeee;
            padding: 15px;

    <h1></h1>

    <div class="vanban" contenteditable="true">
        <h2></h2>

        <p></p>

        <pre><code>&lt;!DOCTYPE html&gt;

    &lt;meta charset="UTF-8"&gt;

&lt;/head&gt;

    &lt;h1&gt;Tiêu đề&lt;/h1&gt;
    &lt;p&gt;Nội dung&lt;/p&gt;

        <h2></h2>

</html>
